/* DiF-Check Styles */

:root {
    --dif-primary: #8b5cf6;
    --dif-secondary: #3b82f6;
    --dif-success: #10b981;
    --dif-warning: #f59e0b;
    --dif-danger: #ef4444;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    -webkit-font-smoothing: antialiased;
}

/* Loading Spinner */
.loading-spinner {
    border: 3px solid rgba(139, 92, 246, 0.1);
    border-radius: 50%;
    border-top-color: var(--dif-primary);
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.fade-in {
    animation: fadeIn 0.5s ease-out;
}

@keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
}

@keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
}

.bot-message {
    animation: slideInLeft 0.3s ease-out;
}

.user-message {
    animation: slideInRight 0.3s ease-out;
}

/* Scrollbar */
.messages-container::-webkit-scrollbar {
    width: 8px;
}

.messages-container::-webkit-scrollbar-track {
    background: #f3f4f6;
    border-radius: 10px;
}

.messages-container::-webkit-scrollbar-thumb {
    background: var(--dif-primary);
    border-radius: 10px;
}

/* Progress Bar */
@keyframes progressBar {
    from { width: 0; }
}

.score-bar {
    animation: progressBar 1s ease-out;
}

/* Demo Badge */
.demo-badge {
    position: fixed;
    top: 20px;
    right: 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    z-index: 1000;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

/* Navigation Buttons */
.nav-button {
    transition: all 0.3s ease;
}

.nav-button:hover {
    transform: translateY(-2px);
}

.nav-button.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

/* FAQ Items */
.faq-item {
    cursor: pointer;
    transition: all 0.3s ease;
}

.faq-item:hover {
    background: #f9fafb;
}

.faq-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
}

.faq-answer.open {
    max-height: 500px;
}

/* Resource Cards */
.resource-card {
    transition: all 0.3s ease;
}

.resource-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

/* Video Embed Container */
.video-container {
    position: relative;
    padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
    height: 0;
    overflow: hidden;
}

.video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 8px;
}

/* Quiz Styles */
.quiz-option {
    transition: all 0.2s ease;
}

.quiz-option:hover {
    transform: translateX(4px);
}

.quiz-option.correct {
    background: #d1fae5;
    border-color: #10b981;
}

.quiz-option.incorrect {
    background: #fee2e2;
    border-color: #ef4444;
}

/* Fake News Fabrik Styles */
.fabrik-step {
    transition: all 0.3s ease;
}

.fabrik-step.active {
    border-color: var(--dif-primary);
    background: #f5f3ff;
}

.fabrik-step.completed {
    border-color: var(--dif-success);
    background: #d1fae5;
}

/* Responsive */
@media (max-width: 768px) {
    .demo-badge {
        top: 10px;
        right: 10px;
        font-size: 12px;
        padding: 6px 12px;
    }
}

    // Wir erstellen die "Kiste" namens DifCheckHelpers im Browser-Speicher
    window.DifCheckHelpers = {
        
        // Werkzeug 1: Die Simulation der Analyse
        generateMockAnalysis: function() {
            return {
                scores: { 
                    quelle: Math.floor(Math.random() * 40) + 30, 
                    emotion: Math.floor(Math.random() * 40) + 20, 
                    evidenz: Math.floor(Math.random() * 40) + 30, 
                    kontext: Math.floor(Math.random() * 40) + 40 
                },
                overall_score: Math.floor(Math.random() * 40) + 30,
                risk_level: 'hoch',
                erklaerungen: { 
                    quelle: 'Die Quelle ist nicht eindeutig erkennbar.', 
                    emotion: 'Sehr emotionale Sprache.', 
                    evidenz: 'Keine konkreten Quellen genannt.', 
                    kontext: 'Wichtige Informationen fehlen.' 
                },
                lernmomente: ['Emotionale Sprache soll dich zum schnellen Teilen bewegen', 'Fehlende Quellenangaben sind ein Warnsignal'],
                handlungsempfehlungen: ['❌ Nicht teilen', '🔍 Bei seriösen Medien gegenchecken'],
                warnsignale: ['GROSSBUCHSTABEN', 'Keine Quellenangaben']
            };
        },

        getRiskColor: function(level) { 
            if (!level) return 'gray';
            const l = level.toLowerCase();
            
            if (l.includes('sehr hohes')) return 'red'; 
            if (l.includes('hohes')) return 'red';
            if (l.includes('mittleres')) return 'yellow';
            if (l.includes('niedriges')) return 'green';
            
            return 'gray'; 
        },

        getRiskIcon: function(level) { 
            if (!level) return '❓';
            const l = level.toLowerCase();
            
            if (l.includes('sehr hohes')) return '🚫'; 
            if (l.includes('hohes')) return '❌';      // Das große X
            if (l.includes('mittleres')) return '⚠️';    // Das Warndreieck
            if (l.includes('niedriges')) return '✅';    // Der Haken
            
            return '❓'; 
        },

        // Werkzeug 4: Farben für die Balken
        getScoreColor: function(score) { 
            if (score >= 75) return 'green'; 
            if (score >= 50) return 'yellow'; 
            return 'red'; 
        },

        // Werkzeug 5: Beschriftungen
        DIMENSION_LABELS: { 
            'quelle': '📖 Quelle', 
            'emotion': '😠 Emotion', 
            'evidenz': '🔍 Evidenz', 
            'kontext': '🌍 Kontext' 
        }
    };
    </script>

    } else if (score > 0.3) {
        // UNSICHERES ERGEBNIS
        interpretation = 
            `Das Ergebnis ist uneindeutig.\n\n` +
            `Das Bild könnte echt sein und stark bearbeitet, oder es ist KI-generiert aber sehr realistisch. Moderne KI-Tools erstellen täuschend echte Bilder, und echte Fotos werden oft mit Filtern verfremdet.\n\n` +
            `Suche nach Berichten von seriösen Medien. Prüfe Details wie Schatten, Reflexionen und Proportionen. Teile das Bild nicht weiter, wenn du unsicher bist.`;
            
    } else {
        // GERINGES KI-RISIKO
        interpretation = 
            `Dieses Bild scheint echt zu sein.\n\n` +
            `Die Analyse hat keine KI-Merkmale gefunden. Aber Achtung: Auch echte Fotos können für Fake News missbraucht werden. Alte Fotos werden als aktuell ausgegeben, Szenen werden für Propaganda inszeniert, oder die Beschreibung zum Bild ist falsch.\n\n` +
            `Prüfe den Kontext: Wann und wo wurde das Foto gemacht? Finde die Originalquelle. Stimmt die Behauptung zum Bild? Nutze Faktencheck-Portale aus den Ressourcen.`;
    }
    
    setTimeout(() => {
        addBotMessage(interpretation);
    }, 400);
    
    setTimeout(() => {
        addBotMessage(
            "Teste und vertiefe dein Wissen in unseren Quizzes oder schaue dir spannende Videos an.",
            [
                { label: 'Zum Lernen-Bereich', value: 'go-to-learning' },
                { label: 'Neues Bild checken', value: 'restart' }
            ]
        );
    }, 1200);
};
    const handleRestart = () => {

            addBotMessage(

    return (

// Message Component (Mit Bild-Vorschau Support)
const Message = ({ message, onOptionClick, onContentSubmit }) => {
    if (message.type === 'bot') {
        return (
            <div className="flex items-start space-x-3 bot-message">
                <div className="flex-shrink-0 w-8 h-8 bg-purple-500 rounded-full flex items-center justify-center text-white">
                    🤖
                </div>
                <div className="flex-1">
                    <div className="bg-white rounded-lg p-4 shadow-sm">
                        <p className="text-gray-800">{message.text}</p>
                    </div>

                    {/* Links rendern */}
                    {message.links && (
                        <div className="mt-3 space-y-2">
                            {message.links.map((link, index) => (
                                <a 
                                    key={index}
                                    href={link.url}
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="block w-full text-center px-4 py-3 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg transition-colors duration-200 border border-blue-200 font-bold no-underline"
                                >
                                    {link.label} 🔗
                                </a>
                            ))}
                        </div>
                    )}
                    
                    {/* Optionen rendern */}
                    {message.options && (
                        <div className="mt-3 space-y-2">
                            {message.options.map((option, index) => (
                                <button
                                    key={index}
                                    onClick={() => onOptionClick(option)}
                                    className="block w-full text-left px-4 py-3 bg-purple-50 hover:bg-purple-100 rounded-lg transition-colors duration-200 border border-purple-200"
                                >
                                    {option.label}
                                </button>
                            ))}
                        </div>
                    )}
                    
                    {/* Upload Feld rendern */}
                    {message.showUpload && (
                        <UploadArea 
                            onSubmit={onContentSubmit}
                            inputType={message.inputType} 
                        />
                    )}
                </div>
            </div>
        );
    }
    
    if (message.type === 'user') {
        return (
            <div className="flex items-start space-x-3 justify-end user-message">
                <div className="flex-1 text-right">
                    <div className="inline-block bg-purple-500 text-white rounded-lg p-4 shadow-sm text-left">
                        {/* HIER IST DIE NEUE VORSCHAU-LOGIK */}
                        {message.image && (
                            <div className="mb-2">
                                <img 
                                    src={message.image} 
                                    alt="Upload Vorschau" 
                                    className="max-w-full h-auto rounded-lg border-2 border-purple-400 max-h-60 object-cover"
                                />
                            </div>
                        )}
                        <p>{message.text}</p>
                    </div>
                </div>
                <div className="flex-shrink-0 w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center">
                    👤
                </div>
            </div>
        );
    }
    
    if (message.type === 'loading') {
        return (
            <div className="flex items-center justify-center py-4">
                <div className="loading-spinner"></div>
                <span className="ml-3 text-gray-600">Analysiere...</span>
            </div>
        );
    }
    
    if (message.type === 'analysis-result') {
        return <AnalysisResult result={message.data} />;
    }
    
    return null;
};

// Upload Area Component (Mit "Upload erfolgreich" Feedback)
// Upload Area Component (Mit "Submitted"-Lock State)
const UploadArea = ({ onSubmit, inputType }) => {
    const [inputText, setInputText] = useState('');
    const [file, setFile] = useState(null);
    const [submitted, setSubmitted] = useState(false); // Neuer State: Wurde schon abgesendet?

    // Handler für Datei-Auswahl
    const handleFileSelect = (e) => {
        if (e.target.files && e.target.files[0]) {
            setFile(e.target.files[0]);
        }
    };

    const handleSubmit = () => {
        if (file) {
            onSubmit(file);
            setSubmitted(true); // Wir markieren als "Erledigt"
            // WICHTIG: Wir löschen 'file' NICHT mehr, damit die Anzeige bleibt!
        } else if (inputText.trim()) {
            onSubmit(inputText);
            setSubmitted(true);
            // Auch hier: Text lassen wir stehen oder sperren ihn
        }
    };

    // Wenn bereits abgesendet wurde, zeigen wir nur noch eine "Erledigt"-Box an
    if (submitted) {
        return (
            <div className="mt-4 p-4 bg-gray-50 rounded-lg border-2 border-gray-200 opacity-75">
                <div className="flex items-center justify-center text-green-600 font-bold">
                    <span className="text-xl mr-2">✅</span> 
                    {file ? 'Bild zur Analyse gesendet' : 'Text zur Analyse gesendet'}
                </div>
            </div>
        );
    }

    return (
        <div className="mt-4 p-4 bg-blue-50 rounded-lg border-2 border-dashed border-blue-300">
            
            {/* --- BILD UPLOAD BEREICH --- */}
            {inputType === 'image' && (
                <div className="mb-4">
                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2">
                        Bild hochladen:
                    </label>
                    
                    {!file ? (
                        <div className="relative">
                            <input 
                                type="file" 
                                accept="image/*"
                                onChange={handleFileSelect}
                                className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                            />
                            <div className="bg-white border border-gray-300 text-gray-600 rounded-lg p-3 text-center hover:bg-gray-50 transition-colors flex items-center justify-center">
                                <span className="text-2xl mr-2">📂</span>
                                <span className="font-medium">Hier klicken zum Hochladen</span>
                            </div>
                        </div>
                    ) : (
                        <div className="bg-green-100 border border-green-400 text-green-800 rounded-lg p-3 flex items-center justify-between">
                            <div className="flex items-center overflow-hidden">
                                <span className="text-2xl mr-3">✅</span>
                                <div className="truncate">
                                    <p className="font-bold text-sm">Bild ausgewählt!</p>
                                    <p className="text-xs truncate opacity-75">{file.name}</p>
                                </div>
                            </div>
                            <button 
                                onClick={() => setFile(null)}
                                className="ml-2 text-green-600 hover:text-green-800 font-bold px-2"
                                title="Bild entfernen"
                            >
                                ✕
                            </button>
                        </div>
                    )}
                </div>
            )}

            {/* --- TEXT EINGABE --- */}
            <div className="relative">
                <textarea
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    placeholder={
                        inputType === 'image' ? "Oder Bild-URL hier einfügen..." :
                        inputType === 'url' ? "https://..." :
                        "Füge hier deinen Text oder die Nachricht ein..."
                    }
                    className="w-full p-3 border border-gray-300 rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-purple-500"
                    rows="4"
                    disabled={!!file} 
                />
            </div>
            
            {/* --- ANALYSIEREN BUTTON --- */}
            <button
                onClick={handleSubmit}
                disabled={!inputText.trim() && !file}
                className={`w-full px-4 py-3 rounded-lg transition-all font-bold text-lg shadow-md flex items-center justify-center ${
                    file 
                        ? 'bg-green-600 hover:bg-green-700 text-white transform hover:scale-[1.02]'

                ) : (

            </button>
        </div>
    );

const FakeNewsFabrik = () => {
    const [currentStep, setCurrentStep] = useState(0);
    const [fabrikData, setFabrikData] = useState({
        thema: '',
        zielgruppe: '',
        emotion: '',
        strategie: '',
        schlagzeile: '',
        text: '',
        reflexion: ''
    });
    const [isGenerating, setIsGenerating] = useState(false);
    const [generatedContent, setGeneratedContent] = useState(null);

    const steps = [
        { id: 0, title: 'Thema wählen', icon: '🎯' },
        { id: 1, title: 'Zielgruppe', icon: '👥' },
        { id: 2, title: 'Emotion', icon: '😠' },
        { id: 3, title: 'Strategie', icon: '🎭' },
        { id: 4, title: 'Erstellen', icon: '✍️' },
        { id: 5, title: 'Reflexion', icon: '🤔' }
    ];

    const handleStepComplete = (field, value) => {
        setFabrikData(prev => ({ ...prev, [field]: value }));
        if (currentStep < steps.length - 1) {
            setCurrentStep(currentStep + 1);
        }
    };

    const handleGenerate = async () => {
    setIsGenerating(true);
    try {
        const response = await fetch('/api/generate-fake', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(fabrikData) 
        });
        const data = await response.json();
        setGeneratedContent(data);
    } catch (error) {
        console.error("Fehler bei Generierung:", error);
    }
    setIsGenerating(false);
    };

    return (
        <div>
            {/* Steps Progress */}
            <div className="mb-6">
                <div className="flex items-center justify-between mb-2">
                    {steps.map((step, index) => (
                        <div key={step.id} className="flex items-center">
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${
                                index <= currentStep 
                                    ? 'bg-purple-500 text-white' 
                                    : 'bg-gray-200 text-gray-500'
                            }`}>
                                {step.icon}
                            </div>
                            {index < steps.length - 1 && (
                                <div className={`w-8 h-1 mx-1 ${
                                    index < currentStep ? 'bg-purple-500' : 'bg-gray-200'
                                }`} />
                            )}
                        </div>
                    ))}
                </div>
                <p className="text-xs text-gray-500 text-center">
                    Schritt {currentStep + 1} von {steps.length}: {steps[currentStep].title}
                </p>
            </div>

            {/* Step Content */}
            <div className="min-h-[300px]">
                {currentStep === 0 && (
                    <StepThema onComplete={(value) => handleStepComplete('thema', value)} />
                )}
                {currentStep === 1 && (
                    <StepZielgruppe onComplete={(value) => handleStepComplete('zielgruppe', value)} />
                )}
                {currentStep === 2 && (
                    <StepEmotion onComplete={(value) => handleStepComplete('emotion', value)} />
                )}
                {currentStep === 3 && (
                    <StepStrategie onComplete={(value) => handleStepComplete('strategie', value)} />
                )}
                {currentStep === 4 && (
                    <StepErstellen 
                        data={fabrikData}
                        isGenerating={isGenerating}
                        generatedContent={generatedContent}
                        onGenerate={handleGenerate}
                        onNext={() => setCurrentStep(5)}
                    />
                )}
                {currentStep === 5 && (
                    <StepReflexion 
                        generatedContent={generatedContent}
                        onRestart={() => {
                            setCurrentStep(0);
                            setFabrikData({
                                thema: '', zielgruppe: '', emotion: '', strategie: '',
                                schlagzeile: '', text: '', reflexion: ''
                            });
                            setGeneratedContent(null);
                        }}
                    />
                )}
            </div>
        </div>
    );
};

// Step 5: Erstellen (Finaler Flow mit DALL-E Integration)
const StepErstellen = ({ data, isGenerating, generatedContent, onGenerate, onNext }) => {
    // State für den Bild-Prompt und das finale Bild
    const [imagePrompt, setImagePrompt] = useState(null);
    const [isGeneratingPrompt, setIsGeneratingPrompt] = useState(false);
    const [generatedImage, setGeneratedImage] = useState(null);
    const [isGeneratingImage, setIsGeneratingImage] = useState(false);

    // 1. Automatisch den Bild-Prompt laden, sobald der Text generiert wurde
    React.useEffect(() => {
        if (generatedContent && !generatedContent.error && !imagePrompt && !isGeneratingPrompt) {
            handleGenerateImagePrompt();
        }
    }, [generatedContent]);

    // Funktion: Ruft den Prompt vom Backend ab (Text -> Prompt)
    const handleGenerateImagePrompt = async () => {
        setIsGeneratingPrompt(true);
        try {
            const response = await fetch('/api/generate-image-prompt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    schlagzeile: generatedContent.schlagzeile,
                    text: generatedContent.text
                })
            });
            const data = await response.json();
            setImagePrompt(data.midjourney_prompt); // Der Key heißt im Backend evtl. noch so, das ist okay
        } catch (error) {
            console.error("Fehler beim Bild-Prompt:", error);
        }
        setIsGeneratingPrompt(false);
    };

    // Funktion: Ruft das echte Bild ab (Prompt -> Bild via DALL-E)
    const handleGenerateActualImage = async () => {
        setIsGeneratingImage(true);
        try {
            const response = await fetch('/api/generate-image-flux', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: imagePrompt })
            });
            const data = await response.json();
            
            if (data.error) {
                alert("Fehler bei der Bildgenerierung: " + data.error);
            } else {
                setGeneratedImage(data.image_url);
            }
        } catch (error) {
            console.error("Fehler beim Bild:", error);
            alert("Es gab ein Verbindungsproblem beim Abrufen des Bildes.");
        }
        setIsGeneratingImage(false);
    };

    return (
        <div className="space-y-6 fade-in">
            {!generatedContent ? (
                // ZUSTAND 1: Noch kein Fake-News Text vorhanden
                <div className="text-center py-10">
                    <h4 className="font-bold text-gray-800 mb-6">Bereit? Lass die KI deine Fake News erstellen!</h4>
                    <button
                        onClick={onGenerate}
                        disabled={isGenerating}
                        className="w-full bg-purple-500 hover:bg-purple-600 text-white py-4 rounded-xl transition-colors disabled:opacity-50 flex items-center justify-center text-lg font-bold shadow-lg"
                    >
                        {isGenerating ? (
                            <>
                                <span className="loading-spinner h-6 w-6 mr-3 border-white"></span>
                                🤖 Die KI schreibt die Lügen...
                            </>
                        ) : '✨ Fake News generieren'}
                    </button>
                </div>
            ) : generatedContent.error ? (
                // FEHLERANZEIGE
                <div className="bg-orange-50 border-2 border-orange-300 rounded-lg p-4 text-center">
                    <p className="text-orange-800 font-bold">Ups! Fehler bei der Textgenerierung.</p>
                    <p className="text-sm text-orange-600">{generatedContent.error}</p>
                    <button onClick={onGenerate} className="mt-4 text-purple-600 underline">Nochmal versuchen</button>
                </div>
            ) : (
                // ZUSTAND 2: Fake-News Text ist da -> Zeige Vorschau
                <div className="space-y-8">
                    
                    {/* --- ARTIKEL VORSCHAU --- */}
                    <div className="bg-white rounded-xl shadow-2xl overflow-hidden border border-gray-200">
                        
                        {/* BILD-BEREICH */}
                        <div className="relative bg-gray-100 min-h-[350px] flex items-center justify-center border-b border-gray-200">
                            {generatedImage ? (
                                // A) Bild ist fertig generiert
                                <div className="relative w-full">
                                    <img src={generatedImage} alt="Fake News Bild" className="w-full h-auto object-cover fade-in" />
                                </div>
                            ) : (
                                // B) Bild fehlt noch -> Zeige Prompt & Button
                                <div className="text-center p-8 max-w-lg w-full">
                                    <div className="text-6xl mb-4">📸</div>
                                    <h5 className="font-bold text-gray-800 mb-2 text-xl">Das Beweisfoto fehlt noch!</h5>
                                    
                                    <div className="mt-6 bg-white p-5 rounded-lg shadow-sm border border-gray-200 text-left">
                                        <div className="flex justify-between items-center mb-2">
                                            <p className="text-xs text-purple-600 uppercase font-bold">Die KI schlägt diesen Bild-Prompt vor:</p>
                                            {isGeneratingPrompt && <span className="text-xs text-gray-400 animate-pulse">Generiere...</span>}
                                        </div>
                                        
                                        <div className="bg-gray-50 p-3 rounded border border-gray-200 mb-4 min-h-[60px]">
                                            <p className="text-sm text-gray-600 font-mono italic leading-relaxed">
                                                {imagePrompt ? `"${imagePrompt}"` : "Lade Bild-Beschreibung..."}
                                            </p>
                                        </div>
                                        
                                        <button 
                                            onClick={handleGenerateActualImage}
                                            disabled={!imagePrompt || isGeneratingImage}
                                            className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold transition-all shadow-md flex items-center justify-center text-lg"
                                        >
                                            {isGeneratingImage ? (
                                                <>
                                                    <span className="loading-spinner h-5 w-5 mr-3 border-white"></span>
                                                    Entwickle Foto...
                                                </>
                                            ) : '📸 Dieses Bild jetzt generieren'}
                                        </button>
                                        <p className="text-xs text-gray-400 text-center mt-2">
                                            Klicke hier, um Flux zu starten.
                                        </p>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* TEXT-BEREICH */}
                        <div className="p-8">
                            <div className="flex items-center space-x-2 mb-3">
                                <span className="bg-red-600 text-white text-xs font-bold px-2 py-0.5 uppercase rounded-sm">Breaking</span>
                                <span className="text-gray-500 text-xs font-bold uppercase tracking-widest">• Exklusiv</span>
                            </div>
                            <h2 className="font-bold text-3xl md:text-4xl mb-4 text-gray-900 leading-tight font-serif">
                                {generatedContent.schlagzeile}
                            </h2>
                            <p className="text-gray-700 text-lg leading-relaxed font-serif">
                                {generatedContent.text}
                            </p>
                        </div>
                    </div>

                    {/* --- INFO & NAVIGATION --- */}
                    <div className="grid md:grid-cols-2 gap-6">
                        <div className="bg-purple-50 rounded-xl p-6 border border-purple-100">
                            <h5 className="font-bold text-purple-900 mb-4 flex items-center">
                                <span className="text-xl mr-2">🕵️‍♂️</span> Hinter den Kulissen
                            </h5>
                            <div className="space-y-4">
                                <div>
                                    <p className="text-xs font-bold text-purple-400 uppercase">Deine Strategie:</p>
                                    <p className="text-purple-900 font-medium">{data.strategie || 'Manipulation'}</p>
                                </div>
                                <div>
                                    <p className="text-xs font-bold text-purple-400 uppercase">Angewandte Techniken:</p>
                                    <ul className="mt-1 space-y-1">
                                        {(generatedContent.manipulationstechniken || []).map((tech, i) => (
                                            <li key={i} className="text-sm text-purple-800 flex items-start">
                                                <span className="mr-2 text-purple-400 font-bold">•</span>{tech}
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-col justify-center space-y-3">
                            <p className="text-center text-sm text-gray-500 italic">
                                Sieht täuschend echt aus, oder?
                            </p>
                            <button
                                onClick={onNext}
                                className="w-full bg-gray-900 hover:bg-black text-white py-4 rounded-xl transition-all font-bold shadow-lg flex items-center justify-center transform hover:scale-[1.02]"
                            >
                                Weiter zur Reflexion →
                            </button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

// ======================
// QUIZ COMPONENT
// ======================
const QuizComponent = ({ quiz }) => {
    const [currentQuestion, setCurrentQuestion] = useState(0);
    const [selectedAnswer, setSelectedAnswer] = useState(null);
    const [showExplanation, setShowExplanation] = useState(false);
    const [score, setScore] = useState(0);
    const [completed, setCompleted] = useState(false);

    const question = quiz.questions[currentQuestion];

    const handleAnswer = (index) => {
        if (selectedAnswer !== null) return; // Already answered
        
        setSelectedAnswer(index);
        setShowExplanation(true);
        
        if (index === question.correctIndex) {
            setScore(score + 1);
        }
    };

    const handleNext = () => {
        if (currentQuestion < quiz.questions.length - 1) {
            setCurrentQuestion(currentQuestion + 1);
            setSelectedAnswer(null);
            setShowExplanation(false);
        } else {
            setCompleted(true);
        }
    };

    const handleRestart = () => {
        setCurrentQuestion(0);
        setSelectedAnswer(null);
        setShowExplanation(false);
        setScore(0);
        setCompleted(false);
    };

    if (completed) {
        const percentage = Math.round((score / quiz.questions.length) * 100);
        return (
            <div className="bg-white rounded-xl shadow-lg p-8 text-center">
                <div className="text-6xl mb-4">
                    {percentage >= 80 ? '🎉' : percentage >= 60 ? '👍' : '💪'}
                </div>
                <h3 className="text-3xl font-bold text-gray-800 mb-4">
                    Quiz abgeschlossen!
                </h3>
                <div className="text-5xl font-bold text-purple-600 mb-2">
                    {score} / {quiz.questions.length}
                </div>
                <p className="text-xl text-gray-600 mb-6">
                    {percentage >= 80 ? 'Hervorragend! 🌟' : 
                     percentage >= 60 ? 'Gut gemacht! 👏' : 
                     'Nicht aufgeben! Übe weiter! 💪'}
                </p>
                <div className="bg-gray-200 rounded-full h-4 mb-6">
                    <div 
                        className="score-bar bg-gradient-to-r from-purple-500 to-blue-500 h-4 rounded-full"
                        style={{ width: `${percentage}%` }}
                    ></div>
                </div>
                <button
                    onClick={handleRestart}
                    className="bg-purple-500 hover:bg-purple-600 text-white px-8 py-3 rounded-lg text-lg font-semibold transition-colors"
                >
                    🔄 Nochmal spielen
                </button>
            </div>
        );
    }

    return (
        <div className="bg-white rounded-xl shadow-lg p-8">
            {/* Progress */}
            <div className="flex items-center justify-between mb-6">
                <span className="text-sm text-gray-500">
                    Frage {currentQuestion + 1} von {quiz.questions.length}
                </span>
                <span className="text-sm font-semibold text-purple-600">
                    Score: {score}/{quiz.questions.length}
                </span>
            </div>

            {/* Progress Bar */}
            <div className="bg-gray-200 rounded-full h-2 mb-8">
                <div 
                    className="bg-gradient-to-r from-purple-500 to-blue-500 h-2 rounded-full transition-all duration-300"
                    style={{ width: `${((currentQuestion + 1) / quiz.questions.length) * 100}%` }}
                ></div>
            </div>

            {/* Question */}
            <h4 className="text-xl font-bold text-gray-800 mb-6">
                {question.question}
            </h4>

            {/* Options */}
            <div className="space-y-3 mb-6">
                {question.options.map((option, index) => (
                    <button
                        key={index}
                        onClick={() => handleAnswer(index)}
                        disabled={selectedAnswer !== null}
                        className={`quiz-option w-full text-left p-4 rounded-lg border-2 transition-all ${
                            selectedAnswer === null
                                ? 'border-gray-200 hover:border-purple-300 hover:bg-purple-50'
                                : index === question.correctIndex
                                ? 'correct border-green-500'
                                : selectedAnswer === index
                                ? 'incorrect border-red-500'
                                : 'border-gray-200 opacity-50'
                        }`}
                    >
                        <div className="flex items-center">
                            <span className="flex-shrink-0 w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center font-semibold text-sm mr-3">
                                {String.fromCharCode(65 + index)}
                            </span>
                            <span className="text-gray-800">{option}</span>
                            {selectedAnswer !== null && index === question.correctIndex && (
                                <span className="ml-auto text-green-600">✓</span>
                            )}
                            {selectedAnswer === index && index !== question.correctIndex && (
                                <span className="ml-auto text-red-600">✗</span>
                            )}
                        </div>
                    </button>
                ))}
            </div>

            {/* Explanation */}
            {showExplanation && (
                <div className={`p-4 rounded-lg mb-6 ${
                    selectedAnswer === question.correctIndex
                        ? 'bg-green-50 border-l-4 border-green-500'
                        : 'bg-red-50 border-l-4 border-red-500'
                }`}>
                    <p className={`font-semibold mb-2 ${
                        selectedAnswer === question.correctIndex ? 'text-green-800' : 'text-red-800'
                    }`}>
                        {selectedAnswer === question.correctIndex ? '✓ Richtig!' : '✗ Leider falsch'}
                    </p>
                    <p className="text-gray-700 text-sm">{question.explanation}</p>
                </div>
            )}

            {/* Next Button */}
            {showExplanation && (
                <button
                    onClick={handleNext}
                    className="w-full bg-purple-500 hover:bg-purple-600 text-white py-3 rounded-lg font-semibold transition-colors"
                >
                    {currentQuestion < quiz.questions.length - 1 ? 'Nächste Frage →' : 'Quiz beenden ✓'}
                </button>
            )}
        </div>
    );
};

                                                <label key={optIndex} className="flex items-center p-3 rounded-lg hover:bg-gray-50 cursor-pointer">
                                                    <input
                                                        type="radio"
                                                        name={q.id}
                                                        value={option}
                                                        checked={answers[q.id] === option}
                                                        onChange={(e) => handleAnswerChange(q.id, e.target.value)}
                                                        className="w-4 h-4 text-purple-600 mr-3"
                                                    />
                                                    <span className="text-gray-700">{option}</span>
                                                </label>
                                            ))}
                                        </div>
                                    )}

                                    {q.type === 'checkbox' && (
                                        <div className="space-y-2">
                                            {q.options.map((option, optIndex) => (
                                                <label key={optIndex} className="flex items-center p-3 rounded-lg hover:bg-gray-50 cursor-pointer">
                                                    <input
                                                        type="checkbox"
                                                        value={option}
                                                        checked={(answers[q.id] || []).includes(option)}
                                                        onChange={(e) => handleAnswerChange(q.id, e.target.value, true)}
                                                        className="w-4 h-4 text-purple-600 mr-3"
                                                    />
                                                    <span className="text-gray-700">{option}</span>
                                                </label>
                                            ))}
                                        </div>
                                    )}

                                    {q.type === 'textarea' && (
                                        <textarea
                                            value={answers[q.id] || ''}
                                            onChange={(e) => handleAnswerChange(q.id, e.target.value)}
                                            placeholder={q.placeholder}
                                            rows="4"
                                            className="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                        ></textarea>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                ))}
            </div>

            <div className="mt-8 text-center">
                <button
                    onClick={handleComplete}
                    disabled={answeredCount < totalQuestions}
                    className={`px-8 py-4 rounded-lg text-lg font-semibold transition-all ${
                        answeredCount < totalQuestions
                            ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
                            : 'bg-purple-500 hover:bg-purple-600 text-white shadow-lg'
                    }`}
                >
                    {answeredCount < totalQuestions 
                        ? `Noch ${totalQuestions - answeredCount} Frage${totalQuestions - answeredCount > 1 ? 'n' : ''} offen`
                        : '✓ Reflexion abschließen'
                    }
                </button>
                {answeredCount < totalQuestions && (
                    <p className="text-sm text-gray-500 mt-3">
                        Beantworte alle Fragen, um deine Reflexion abzuschließen
                    </p>
                )}
            </div>
        </div>
    );
};

const DownloadItem = ({ icon, title, size, description, available = false, link }) => {
    const handleDownload = () => {
        if (!available) return;
        if (link) {
            window.open(link, '_blank');
        }
    };

    return (
        <div className={`flex items-start p-4 rounded-lg ${available ? 'bg-gray-50' : 'bg-gray-50 opacity-50'}`}>
            <div className="text-3xl mr-4">{icon}</div>
            <div className="flex-1">
                <div className="flex items-center justify-between mb-1">
                    <h4 className="font-bold text-gray-800">{title}</h4>
                    <span className="text-xs text-gray-500">{size}</span>
                </div>
                <p className="text-sm text-gray-600">{description}</p>
            </div>
            <button 
                onClick={handleDownload}
                disabled={!available}
                className={`ml-4 px-4 py-2 rounded-lg text-sm transition-colors ${
                    available 
                        ? 'bg-purple-500 hover:bg-purple-600 text-white cursor-pointer' 
                        : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                }`}
            >
                {available ? '⬇️ Download' : '⬇️ Bald'}
            </button>
        </div>
    );
};
